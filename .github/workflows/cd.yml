name: CD Producción

on:
  push:
    branches: [ "main" ]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Empaquetar backend (JAR)
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Construir frontend
        working-directory: front
        run: |
          npm ci
          npx ng build --configuration production

      - name: Publicar artefacto backend
        uses: actions/upload-artifact@v4
        with:
          name: mikhuy-backend-jar
          path: backend/target/*.jar

      - name: Publicar artefacto frontend
        uses: actions/upload-artifact@v4
        with:
          name: mikhuy-frontend-dist
          path: front/dist/saboriq-frontend